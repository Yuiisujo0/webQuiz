<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Math Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding-top: 50px;
    }

    .game-box {
      width: 350px;
      background: white;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 100px;
      padding: 10px;
      font-size: 18px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      background: #007bff;
      color: white;
    }

    .feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="game-box">
    <h2>Math Quiz Game</h2>

    <p id="question">Loading...</p>

    <input type="number" id="answer" placeholder="Your answer" />

    <br />
    <button onclick="checkAnswer()">Submit</button>

    <p class="feedback" id="feedback"></p>
    <p class="score">Score: <span id="score">0</span></p>
  </div>

  <script>
    let num1, num2, correctAnswer;
    let score = 0;

    function generateQuestion() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;

      const operators = ["+", "-", "*"];
      const op = operators[Math.floor(Math.random() * operators.length)];

      document.getElementById("question").textContent = `${num1} ${op} ${num2}`;

      if (op === "+") correctAnswer = num1 + num2;
      if (op === "-") correctAnswer = num1 - num2;
      if (op === "*") correctAnswer = num1 * num2;
    }

    function checkAnswer() {
      const userAnswer = Number(document.getElementById("answer").value);

      if (userAnswer === correctAnswer) {
        document.getElementById("feedback").textContent = "Correct!";
        document.getElementById("feedback").style.color = "green";
        score++;
      } else {
        document.getElementById("feedback").textContent = `Wrong! Answer was ${correctAnswer}`;
        document.getElementById("feedback").style.color = "red";
      }

      document.getElementById("score").textContent = score;

      document.getElementById("answer").value = "";
      generateQuestion();
    }

    generateQuestion();
  </script>

</body>
</html>
