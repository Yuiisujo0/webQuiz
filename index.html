<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cool Math Quiz</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .game-box {
      width: 380px;
      background: #ffffffdd;
      backdrop-filter: blur(8px);
      padding: 35px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
      color: #333;
    }

    #question {
      font-size: 28px;
      font-weight: 600;
      margin: 10px 0 25px;
    }

    input {
      width: 150px;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      border: 2px solid #aaa;
      text-align: center;
      transition: 0.25s;
    }

    input:focus {
      border-color: #6a11cb;
      outline: none;
      box-shadow: 0 0 10px #6a11cb66;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      margin-top: 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      font-weight: 600;
      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 15px rgba(0,0,0,0.25);
    }

    .feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      min-height: 28px;
      transition: 0.3s ease;
    }

    .score {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="game-box">
    <h2>✨ Math Quiz Game ✨</h2>

    <p id="question">Loading...</p>

    <input type="number" id="answer" placeholder="Enter answer" />

    <br />
    <button onclick="checkAnswer()">Submit</button>

    <p class="feedback" id="feedback"></p>
    <p class="score">Score: <span id="score">0</span></p>
  </div>

  <script>
    let num1, num2, correctAnswer;
    let score = 0;

    function generateQuestion() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;

      const operators = ["+", "-", "*"];
      const op = operators[Math.floor(Math.random() * operators.length)];

      document.getElementById("question").textContent = `${num1} ${op} ${num2}`;

      if (op === "+") correctAnswer = num1 + num2;
      if (op === "-") correctAnswer = num1 - num2;
      if (op === "*") correctAnswer = num1 * num2;
    }

    function checkAnswer() {
      const userAnswer = Number(document.getElementById("answer").value);
      const feedback = document.getElementById("feedback");

      if (userAnswer === correctAnswer) {
        feedback.textContent = "✔️ Correct!";
        feedback.style.color = "green";
        score++;
      } else {
        feedback.textContent = `❌ Wrong! Correct answer: ${correctAnswer}`;
        feedback.style.color = "red";
      }

      document.getElementById("score").textContent = score;
      document.getElementById("answer").value = "";
      generateQuestion();
    }

    generateQuestion();
  </script>

</body>
</html>
